name: Update data & deploy

on:
  schedule:
    # 06:00 UTC daily -- after Brown Dust 2 (00:00), Blue Archive (19:00 prev)
    # and NIKKE (20:00 prev) have reset, so the phone sees a fresh day.
    - cron: "0 6 * * *"
  workflow_dispatch:      # lets you trigger a refresh by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write         # to commit refreshed data back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-web.txt

      - name: Scrape sources and build the web payload
        run: python build_web.py

      - name: Commit refreshed data
        # keeps the last good dataset in git, so a future run where a source
        # is down can fall back to it instead of publishing nothing
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data web/images
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh gacha data [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
